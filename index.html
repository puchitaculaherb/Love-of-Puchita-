<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงเพื่อนของเรา</title>

<style>
body {
    margin: 0;
    background: linear-gradient(to bottom, #111, #222);
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.scene {
    position: absolute;
    opacity: 0;
    transition: opacity 2s;
    max-width: 90%;
    font-size: 1.8rem;
    line-height: 1.8;
}

.show {
    opacity: 1;
}

#startBtn {
    padding: 18px 36px;
    font-size: 1.5rem;
    border: none;
    border-radius: 40px;
    background: #ff6b81;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<button id="startBtn">กดเพื่อเริ่ม</button>
<audio id="bgMusic" src="song.mp3"></audio>

<div class="scene">ถึงเพื่อนของเรา</div>
<div class="scene">เราภูชิตะนะ</div>
<div class="scene">แล้วนี่คือสิ่งที่อยากบอกพวกแก</div>
<div class="scene">ก่อนที่ช่วงเวลานี้จะจบลง</div>
<div class="scene">เรารักพวกแกนะ</div>

<script>
const scenes = document.querySelectorAll(".scene");
const startBtn = document.getElementById("startBtn");
const music = document.getElementById("bgMusic");

startBtn.onclick = () => {
    startBtn.style.display = "none";
    music.play();

    let i = 0;
    function showNext() {
        if (i > 0) scenes[i - 1].classList.remove("show");
        if (i < scenes.length) {
            scenes[i].classList.add("show");
            i++;
            setTimeout(showNext, 4000);
        }
    }
    showNext();
};
</script>

</body>
</html>
